<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#181400"/>
      <stop offset="100%" style="stop-color:#2a1f00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="900" cy="80" r="180" fill="#f5c842" opacity="0.04"/>
  <circle cx="100" cy="420" r="140" fill="#f5c842" opacity="0.03"/>
  <circle cx="512" cy="250" r="320" fill="#f5c842" opacity="0.015"/>

  <!-- Garis dekoratif -->
  <line x1="0" y1="490" x2="1024" y2="490" stroke="#7a6500" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="10" x2="1024" y2="10" stroke="#7a6500" stroke-width="1" opacity="0.4"/>

  <!-- Logo / icon area kiri -->
  <rect x="60" y="160" width="120" height="120" rx="28" fill="#f5c842" opacity="0.12"/>
  <rect x="68" y="168" width="104" height="104" rx="22" fill="#f5c842" opacity="0.08"/>
  <text x="120" y="238" text-anchor="middle" font-size="56" font-family="serif">📓</text>

  <!-- Nama app -->
  <text x="210" y="220" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#f5c842" filter="url(#glow)" letter-spacing="-2">KapurPad</text>
  <text x="212" y="258" font-family="-apple-system, sans-serif" font-size="22" fill="#c8a800" letter-spacing="1">Catatan Harian yang Sederhana &amp; Bermakna</text>

  <!-- Divider -->
  <rect x="210" y="275" width="580" height="2" rx="1" fill="#7a6500" opacity="0.5"/>

  <!-- Fitur pills -->
  <!-- Pill 1 -->
  <rect x="210" y="296" width="148" height="36" rx="18" fill="#f5c842" opacity="0.12"/>
  <text x="216" y="319" font-family="sans-serif" font-size="15" fill="#f5c842">📝 Catatan &amp; Ceklis</text>

  <!-- Pill 2 -->
  <rect x="370" y="296" width="128" height="36" rx="18" fill="#f5c842" opacity="0.12"/>
  <text x="376" y="319" font-family="sans-serif" font-size="15" fill="#f5c842">📿 Dzikir Harian</text>

  <!-- Pill 3 -->
  <rect x="510" y="296" width="128" height="36" rx="18" fill="#f5c842" opacity="0.12"/>
  <text x="516" y="319" font-family="sans-serif" font-size="15" fill="#f5c842">🔔 Smart Reminder</text>

  <!-- Pill 4 -->
  <rect x="210" y="342" width="118" height="36" rx="18" fill="#f5c842" opacity="0.12"/>
  <text x="216" y="365" font-family="sans-serif" font-size="15" fill="#f5c842">🏷️ Tag Mood</text>

  <!-- Pill 5 -->
  <rect x="340" y="342" width="118" height="36" rx="18" fill="#f5c842" opacity="0.12"/>
  <text x="346" y="365" font-family="sans-serif" font-size="15" fill="#f5c842">🔒 Kunci Catatan</text>

  <!-- Pill 6 -->
  <rect x="470" y="342" width="118" height="36" rx="18" fill="#f5c842" opacity="0.12"/>
  <text x="476" y="365" font-family="sans-serif" font-size="15" fill="#f5c842">🌙 Mode Gelap</text>

  <!-- Mock phone kanan -->
  <rect x="820" y="60" width="144" height="280" rx="20" fill="#1a1500" stroke="#7a6500" stroke-width="1.5"/>
  <rect x="828" y="72" width="128" height="256" rx="14" fill="#120f00"/>
  <!-- notch -->
  <rect x="872" y="66" width="40" height="8" rx="4" fill="#0d0b00"/>
  <!-- layar konten mockup -->
  <rect x="834" y="82" width="116" height="16" rx="4" fill="#f5c842" opacity="0.2"/>
  <rect x="834" y="104" width="80" height="8" rx="3" fill="#7a6500" opacity="0.5"/>
  <rect x="834" y="118" width="116" height="40" rx="6" fill="#1e1800"/>
  <rect x="840" y="124" width="70" height="6" rx="2" fill="#f5c842" opacity="0.4"/>
  <rect x="840" y="136" width="50" height="5" rx="2" fill="#7a6500" opacity="0.4"/>
  <rect x="834" y="165" width="116" height="40" rx="6" fill="#1e1800"/>
  <rect x="840" y="171" width="60" height="6" rx="2" fill="#34c776" opacity="0.5"/>
  <rect x="840" y="183" width="80" height="5" rx="2" fill="#7a6500" opacity="0.4"/>
  <rect x="834" y="212" width="116" height="40" rx="6" fill="#1e1800"/>
  <rect x="840" y="218" width="50" height="6" rx="2" fill="#3d9de8" opacity="0.5"/>
  <rect x="840" y="230" width="70" height="5" rx="2" fill="#7a6500" opacity="0.4"/>
  <!-- bottom nav mockup -->
  <rect x="828" y="296" width="128" height="28" rx="0" fill="#140f00"/>
  <text x="860" y="315" font-size="12" text-anchor="middle">📋</text>
  <text x="892" y="315" font-size="12" text-anchor="middle">📿</text>
  <text x="924" y="315" font-size="12" text-anchor="middle">⚙️</text>

  <!-- Tagline bawah -->
  <text x="512" y="465" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#7a6500" letter-spacing="2">GRATIS · OFFLINE · TANPA IKLAN</text>
</svg>
